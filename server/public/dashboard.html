<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Roll Call</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark">RC</div>
    <div><strong>Roll Call</strong></div>
  </div>
  <div class="row" style="gap:12px;">
    <div class="who">
      <div id="whoName"></div>
      <div id="whoEmail" style="color:#a8a29e;"></div>
    </div>
    <span id="roleBadge" class="badge"></span>
    <button class="btn ghost" style="border-color:#57534e; color:#f5f5f4;" onclick="logout()">Log out</button>
  </div>
</header>
<main id="app"></main>
<script src="/dashboard.js"></script>
</body>
</html>
